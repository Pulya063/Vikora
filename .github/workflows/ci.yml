name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      scope:
        description: "cloudflare = only the Workers stack (gate for Cloudflare deploys); all = also legacy FastAPI/Docker checks"
        type: string
        default: all

permissions:
  contents: read

jobs:
  # Frontend (Next.js via OpenNext) + API Worker (Hono, D1). Gates Cloudflare deploys.
  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_BACKEND_MODE: cloudflare
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: "10"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci --prefix frontend
          pnpm --dir cloudflare-backend install --frozen-lockfile
      - name: Frontend contracts, types and Cloudflare build
        working-directory: frontend
        run: |
          npm run test:contract
          npm run typecheck
          npm run build:cloudflare
      - name: Cloudflare Worker types, lint, tests and D1 migrations
        run: |
          pnpm --dir cloudflare-backend typecheck
          pnpm --dir cloudflare-backend lint
          pnpm --dir cloudflare-backend test
          pnpm --dir cloudflare-backend exec wrangler d1 migrations apply DB --local --persist-to .wrangler-ci
      - name: Production dependency audit
        run: |
          npm audit --prefix frontend --omit=dev --audit-level=high
          pnpm --dir cloudflare-backend audit --prod --audit-level=high

  # Previous FastAPI/Postgres/Docker stack (Render). Not required for Cloudflare deploys.
  legacy:
    if: ${{ inputs.scope != 'cloudflare' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vikora
          POSTGRES_PASSWORD: ci_ephemeral_only
          POSTGRES_DB: vikora_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vikora -d vikora_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://vikora:ci_ephemeral_only@127.0.0.1:5432/vikora_test
      VIKORA_TEST_DATABASE_URL: postgresql+asyncpg://vikora:ci_ephemeral_only@127.0.0.1:5432/vikora_test
      DATABASE_SSL_MODE: disable
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          python -m pip install -r backend/requirements.lock.txt
          npm ci --prefix frontend
      - name: Check migrations on real PostgreSQL
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m alembic check
      - name: Backend, Telegram and cross-language contract tests
        working-directory: backend
        run: python -m pytest -q -p no:cacheprovider
      - name: Deployment orchestration tests (no cloud requests)
        run: python -m unittest discover -s scripts/tests -v
      - name: Browser tests with mocked API
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:forms
      - name: Validate Compose and build release images
        run: |
          docker compose config --quiet
          docker build -t vikora-api:ci backend
          docker build -t vikora-front:ci -f frontend/Dockerfile .
