name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  # Frontend (Next.js via OpenNext) + API Worker (Hono, D1). Gates Cloudflare deploys.
  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_BACKEND_MODE: cloudflare
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: "10"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci --prefix frontend
          pnpm --dir cloudflare-backend install --frozen-lockfile
      - name: Frontend contracts, types and Cloudflare build
        working-directory: frontend
        run: |
          npm run test:contract
          npm run typecheck
          npm run build:cloudflare
      - name: Cloudflare Worker types, lint, tests and D1 migrations
        run: |
          pnpm --dir cloudflare-backend typecheck
          pnpm --dir cloudflare-backend lint
          pnpm --dir cloudflare-backend test
          pnpm --dir cloudflare-backend exec wrangler d1 migrations apply DB --local --persist-to .wrangler-ci
      - name: Production dependency audit
        run: |
          npm audit --prefix frontend --omit=dev --audit-level=high
          pnpm --dir cloudflare-backend audit --prod --audit-level=high
