name: Deploy Render (manual)

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: Deploy this main commit to existing paid services
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: render-production
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && inputs.confirm_deploy
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 65
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Deploy verified commit and wait for each service
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_SERVICE_ID: ${{ vars.RENDER_API_SERVICE_ID }}
          RENDER_WORKER_SERVICE_ID: ${{ vars.RENDER_WORKER_SERVICE_ID }}
          RENDER_FRONT_SERVICE_ID: ${{ vars.RENDER_FRONT_SERVICE_ID }}
        run: python scripts/deploy_render.py
