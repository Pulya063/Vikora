name: Deploy Cloudflare (manual)

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment environment
        type: choice
        options: [staging, production]
        default: staging
        required: true
      confirm_deploy:
        description: Apply remote D1 migrations and deploy the verified commit
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  verify:
    if: inputs.confirm_deploy && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  deploy-api:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: "10"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: cloudflare-backend/pnpm-lock.yaml
      - run: pnpm --dir cloudflare-backend install --frozen-lockfile
      - name: Refuse placeholder infrastructure
        env:
          TARGET: ${{ inputs.target }}
        run: |
          # Placeholder D1 IDs / origins left in wrangler.jsonc must be replaced before a real deploy.
          if [ "$TARGET" = "staging" ]; then PATTERN='11111111-1111|staging\.example\.invalid'; else PATTERN='22222222-2222|https://example\.invalid'; fi
          if grep -Eq "$PATTERN" cloudflare-backend/wrangler.jsonc; then
            echo "::error::Replace placeholder D1 database_id / ALLOWED_ORIGINS for '$TARGET' in cloudflare-backend/wrangler.jsonc."
            exit 1
          fi
      - name: Require explicit repository gate
        env:
          DEPLOY_ENABLED: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED }}
        run: |
          if [ "$DEPLOY_ENABLED" != "true" ]; then
            echo "::error::Set repository variable CLOUDFLARE_DEPLOY_ENABLED=true to allow Cloudflare deploys."
            exit 1
          fi
      - name: Apply migrations and deploy Worker
        working-directory: cloudflare-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler d1 migrations apply DB --remote --env "${{ inputs.target }}"
          pnpm exec wrangler deploy --env "${{ inputs.target }}"
      - name: Verify deployed API health
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then echo "::error::Set environment variable API_URL (https://<api-worker>.workers.dev) for '${{ inputs.target }}'."; exit 1; fi
          case "$API_URL" in https://*) ;; *) echo "::error::API_URL must use HTTPS"; exit 1;; esac
          curl --fail --silent --show-error --retry 3 --retry-all-errors "$API_URL/health"

  deploy-frontend:
    needs: deploy-api
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Build and deploy Next.js Worker
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The site calls its own /api/* routes; they reach the API Worker via the BACKEND service binding.
          NEXT_PUBLIC_API_BASE_URL: ""
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_TURNSTILE_BYPASS: "false"
          NEXT_PUBLIC_BACKEND_MODE: cloudflare
          ALLOW_INDEXING: ${{ inputs.target == 'production' && 'true' || 'false' }}
        run: |
          for name in NEXT_PUBLIC_SITE_URL NEXT_PUBLIC_TURNSTILE_SITE_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Set environment variable $name for '${{ inputs.target }}'."; exit 1; fi
          done
          case "$NEXT_PUBLIC_SITE_URL" in https://*) ;; *) echo "::error::NEXT_PUBLIC_SITE_URL must use HTTPS"; exit 1;; esac
          npx opennextjs-cloudflare build --env "${{ inputs.target }}"
          npx opennextjs-cloudflare deploy --env "${{ inputs.target }}" -- --keep-vars
